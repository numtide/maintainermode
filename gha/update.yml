# Copy to .github/workflows/update.yml in your fork of nixpkgs-review-gha
# (or any repository of yours), and set the GH_TOKEN secret: a token that can
# push to your nixpkgs fork. Maintainer Mode starts it from a package page.
name: update
run-name: update ${{ inputs.attr }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      attr:
        description: "nixpkgs attribute"
        required: true
        type: string
      version:
        description: "Version to update to; empty for the newest"
        required: false
        type: string
        default: ""
      fork:
        description: "Your fork of nixpkgs, owner/name"
        required: true
        type: string

permissions: {}

jobs:
  update:
    uses: numtide/maintainermode/.github/workflows/update.yml@main
    with:
      attr: ${{ inputs.attr }}
      version: ${{ inputs.version }}
      fork: ${{ inputs.fork }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
