[package]
name = "maintainer-mode"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Review a nixpkgs pull request, get yours on the list"

[dependencies]
anyhow = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
sha2 = "0.10"
pulldown-cmark = { version = "0.12", default-features = false, features = [
  "html",
] }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "process",
  "io-util",
] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
ring = "0.17"
zstd = "0.13"
html-macro = { path = "html-macro" }

[profile.release]
strip = true
